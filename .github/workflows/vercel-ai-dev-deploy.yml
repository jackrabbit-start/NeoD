name: Deploy ai-dev to Vercel Production

on:
  push:
    branches:
      - ai-dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-ai-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VERCEL_CLI_VERSION: 52.0.0
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.11.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build app
        run: pnpm build

      - name: Install Vercel CLI
        run: npm install --global vercel@${VERCEL_CLI_VERSION}

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Confirm Vercel Node.js override
        run: |
          set -euo pipefail

          package_node_version="$(node -p "require('./package.json').engines?.node || ''")"
          project_node_version="$(node -p "require('./.vercel/project.json').settings?.nodeVersion || ''")"

          echo "package.json engines.node: ${package_node_version}"
          echo "Vercel project settings nodeVersion: ${project_node_version}"

          if [ "${package_node_version}" != "22.x" ]; then
            echo "Expected package.json engines.node to pin Vercel builds to 22.x."
            exit 1
          fi

      - name: Build Vercel artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel production
        run: |
          set -euo pipefail

          attempts=3
          delay_seconds=10
          inspect_timeout=5m
          promote_timeout=5m

          for attempt in $(seq 1 "$attempts"); do
            echo "Vercel staged deploy attempt ${attempt}/${attempts}"

            deploy_stdout_file="$(mktemp)"
            deploy_stderr_file="$(mktemp)"
            deploy_exit_code=0

            if ! vercel deploy --prebuilt --archive=tgz --prod --skip-domain --no-wait --token=${{ secrets.VERCEL_TOKEN }} >"${deploy_stdout_file}" 2>"${deploy_stderr_file}"; then
              deploy_exit_code=$?
            fi

            cat "${deploy_stderr_file}"

            deployment_url="$(tr -d '\r' < "${deploy_stdout_file}" | awk 'NF { last = $0 } END { print last }')"

            if [ -n "${deployment_url}" ]; then
              echo "Captured staged deployment URL: ${deployment_url}"

              if vercel inspect "${deployment_url}" --wait --timeout="${inspect_timeout}" --token=${{ secrets.VERCEL_TOKEN }}; then
                echo "Staged production deployment is ready. Promoting it to current production..."

                if vercel promote "${deployment_url}" --yes --timeout="${promote_timeout}" --token=${{ secrets.VERCEL_TOKEN }}; then
                  exit 0
                fi

                echo "Promotion did not complete cleanly. Checking promotion status before retry..."
                vercel promote status --timeout="${promote_timeout}" --token=${{ secrets.VERCEL_TOKEN }} || true
              fi

              echo "Staged deployment did not become ready through the inspect wait path. Printing available Vercel logs before retry..."
              vercel inspect "${deployment_url}" --logs --token=${{ secrets.VERCEL_TOKEN }} || true
            fi

            if [ "${deploy_exit_code}" -ne 0 ]; then
              echo "vercel deploy exited with code ${deploy_exit_code} before staged deployment readiness succeeded."
            fi

            if [ "$attempt" -lt "$attempts" ]; then
              echo "Vercel staged deploy/promote attempt failed. Retrying in ${delay_seconds}s..."
              sleep "$delay_seconds"
            fi
          done

          echo "Vercel staged deploy/promote failed after ${attempts} attempts."
          exit 1
