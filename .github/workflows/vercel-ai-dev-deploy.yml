name: Deploy ai-dev to Vercel Production

on:
  push:
    branches:
      - ai-dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-ai-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VERCEL_CLI_VERSION: 52.0.0
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.11.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build app
        run: pnpm build

      - name: Install Vercel CLI
        run: npm install --global vercel@${VERCEL_CLI_VERSION}

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Confirm Vercel Node.js override
        run: |
          set -euo pipefail

          package_node_version="$(node -p "require('./package.json').engines?.node || ''")"
          project_node_version="$(node -p "require('./.vercel/project.json').settings?.nodeVersion || ''")"

          echo "package.json engines.node: ${package_node_version}"
          echo "Vercel project settings nodeVersion: ${project_node_version}"

          if [ "${package_node_version}" != "22.x" ]; then
            echo "Expected package.json engines.node to pin Vercel builds to 22.x."
            exit 1
          fi

      - name: Build Vercel artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel production
        run: |
          set -euo pipefail

          attempts=3
          delay_seconds=10

          for attempt in $(seq 1 "$attempts"); do
            echo "Vercel deploy attempt ${attempt}/${attempts}"

            if vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}; then
              exit 0
            fi

            if [ "$attempt" -lt "$attempts" ]; then
              echo "Vercel deploy failed with a non-zero exit code. Retrying in ${delay_seconds}s..."
              sleep "$delay_seconds"
            fi
          done

          echo "Vercel deploy failed after ${attempts} attempts."
          exit 1
